<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Personal Budgeting &amp; Money Planning</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/budget-plan/budget-plan.html"></iframe>
  <script>
    const routes = {
  "budget-plan": "pages/budget-plan/budget-plan.html",
  "transaction-review": "pages/transaction-review/transaction-review.html",
  "cashflow-runway": "pages/cashflow-runway/cashflow-runway.html",
  "accounts-ledger": "pages/accounts-ledger/accounts-ledger.html",
  "payee-rules": "pages/payee-rules/payee-rules.html",
  "bank-imports": "pages/bank-imports/bank-imports.html",
  "debt-and-goals": "pages/debt-and-goals/debt-and-goals.html",
  "net-worth-insights": "pages/net-worth-insights/net-worth-insights.html",
  "household-privacy": "pages/household-privacy/household-privacy.html",
  "account-detail": "pages/account-detail/account-detail.html",
  "transaction-detail": "pages/transaction-detail/transaction-detail.html",
  "new-transaction-drawer": "pages/new-transaction-drawer/new-transaction-drawer.html",
  "household-share-drawer": "pages/household-share-drawer/household-share-drawer.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'budget-plan';
      const target = routes[route] || routes['budget-plan'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
